[platformio]
src_dir = src
data_dir = data ; Directorio para los archivos del frontend (SPIFFS)

; --- NODO EMISOR (LLAVERO) ---
[env:llavero]
platform = espressif8266
board = d1_mini ; Placa base del WeMOS D1 R2
framework = arduino
monitor_speed = 115200
build_src_filter = +<llavero/*> -<auto/*> -<atacante/*>
lib_ldf_mode = deep+
lib_deps = lsatan/SmartRC-CC1101-Driver-Lib @ ^3.0.2

; --- NODO RECEPTOR (AUTO) ---
[env:auto]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs
build_src_filter = +<auto/*> -<llavero/*> -<atacante/*>
lib_ldf_mode = deep+
lib_deps = 
    mathieucarbou/ESPAsyncWebServer @ ^3.3.2
    mathieucarbou/AsyncTCP @ ^3.2.14
    madhephaestus/ESP32Servo
    lsatan/SmartRC-CC1101-Driver-Lib @ ^3.0.2

; --- NODO INTERCEPTOR (ATACANTE) ---
[env:atacante]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = +<atacante/*> -<auto/*> -<llavero/*>
lib_ldf_mode = deep+
lib_deps = lsatan/SmartRC-CC1101-Driver-Lib @ ^3.0.2

; --- PRUEBA DEL SERVO ---
[env:servo_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<test_servo/*> +<auto/servomotor.cpp> 
lib_deps = madhephaestus/ESP32Servo